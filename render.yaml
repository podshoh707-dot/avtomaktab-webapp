services:
  - type: web
    name: avtomaktab-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBAPP_URL
        value: https://avtomaktab-webapp.vercel.app/
      - key: PORT
        value: 10000
